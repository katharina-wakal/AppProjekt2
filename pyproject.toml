[tool.briefcase]
project_name = "FemHealth"
bundle = "de.hsaalen"
version = "0.1.0"
url = "https://www.hs-aalen.de"
license = "MIT"
author = "HS Aalen"
author_email = "simonereth321@gmail.com"

[tool.briefcase.app.ms-app]
formal_name = "FemHealth"
description = "FemHealth – Zyklus- und Gesundheits-App"
long_description = "Eine App zur Verfolgung des weiblichen Zyklus und der Gesundheit."
sources = ["ms_app/src/ms_app"]
test_sources = ["ms_app/tests"]
icon = "ms_app/src/ms_app/resources/ms_app"

# ── Desktop (PyQt6) ────────────────────────────────────────────────────────
[tool.briefcase.app.ms-app.macOS]
requires = [
    "PyQt6>=6.4",
    "platformdirs>=3.0",
]

[tool.briefcase.app.ms-app.windows]
requires = [
    "PyQt6>=6.4",
    "platformdirs>=3.0",
]

[tool.briefcase.app.ms-app.linux]
requires = [
    "PyQt6>=6.4",
    "platformdirs>=3.0",
]

# ── Mobile (Toga) ──────────────────────────────────────────────────────────
[tool.briefcase.app.ms-app.iOS]
requires = [
    "toga-iOS>=0.4",
    "platformdirs>=3.0",
]

[tool.briefcase.app.ms-app.android]
requires = [
    "toga-android>=0.4",
    "platformdirs>=3.0",
]
